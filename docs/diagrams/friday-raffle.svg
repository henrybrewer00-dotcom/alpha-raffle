<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Friday raffle</title>
  <desc id="desc">A guide starts one prize. Students put tickets in. The pie fills live. Spin picks a winner on every phone.</desc>
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="56" y="64" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0000EF" letter-spacing="2">ALPHA HIGH</text>
  <text x="56" y="108" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#2D2D2D">Friday raffle</text>
  <text x="56" y="142" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="16" fill="#7A7A7A">One prize at a time. Tickets in. Spin. Winner on every phone.</text>

  <g font-family="Montserrat, Helvetica, Arial, sans-serif">
    <rect x="56" y="188" width="184" height="168" rx="4" fill="#0000EF"/>
    <text x="76" y="222" font-size="12" font-weight="700" fill="#FFB81C">01</text>
    <text x="76" y="258" font-size="18" font-weight="700" fill="#ffffff">Start</text>
    <text x="76" y="286" font-size="13" fill="#ffffff">Guide opens one</text>
    <text x="76" y="306" font-size="13" fill="#ffffff">draft prize.</text>

    <path d="M252 272 H276" stroke="#0000EF" stroke-width="2"/>
    <path d="M268 264 L276 272 L268 280" fill="none" stroke="#0000EF" stroke-width="2"/>

    <rect x="288" y="188" width="184" height="168" rx="4" fill="#F8F8F8" stroke="#E4E4E4"/>
    <text x="308" y="222" font-size="12" font-weight="700" fill="#0000EF">02</text>
    <text x="308" y="258" font-size="18" font-weight="700" fill="#2D2D2D">Enter</text>
    <text x="308" y="286" font-size="13" fill="#7A7A7A">test1@ and test2@</text>
    <text x="308" y="306" font-size="13" fill="#7A7A7A">put tickets in.</text>

    <path d="M484 272 H508" stroke="#0000EF" stroke-width="2"/>
    <path d="M500 264 L508 272 L500 280" fill="none" stroke="#0000EF" stroke-width="2"/>

    <rect x="520" y="188" width="184" height="168" rx="4" fill="#FFB81C"/>
    <text x="540" y="222" font-size="12" font-weight="700" fill="#0000EF">03</text>
    <text x="540" y="258" font-size="18" font-weight="700" fill="#2D2D2D">Live pie</text>
    <text x="540" y="286" font-size="13" fill="#2D2D2D">Board fills in about</text>
    <text x="540" y="306" font-size="13" fill="#2D2D2D">one second. No reload.</text>

    <path d="M716 272 H740" stroke="#0000EF" stroke-width="2"/>
    <path d="M732 264 L740 272 L732 280" fill="none" stroke="#0000EF" stroke-width="2"/>

    <rect x="752" y="188" width="184" height="168" rx="4" fill="#2D2D2D"/>
    <text x="772" y="222" font-size="12" font-weight="700" fill="#FFB81C">04</text>
    <text x="772" y="258" font-size="18" font-weight="700" fill="#ffffff">Spin</text>
    <text x="772" y="286" font-size="13" fill="#ffffff">Winner is picked,</text>
    <text x="772" y="306" font-size="13" fill="#ffffff">then shown to all.</text>
  </g>

  <g font-family="Montserrat, Helvetica, Arial, sans-serif">
    <text x="56" y="412" font-size="13" font-weight="700" fill="#0000EF" letter-spacing="1.4">WHAT NEVER CHANGES</text>
    <rect x="56" y="432" width="312" height="72" rx="4" fill="#F8F8F8"/>
    <text x="76" y="462" font-size="15" font-weight="600" fill="#2D2D2D">Prizes stay draft until Start</text>
    <text x="76" y="484" font-size="13" fill="#7A7A7A">Students see nothing until then.</text>

    <rect x="384" y="432" width="312" height="72" rx="4" fill="#F8F8F8"/>
    <text x="404" y="462" font-size="15" font-weight="600" fill="#2D2D2D">One open prize at a time</text>
    <text x="404" y="484" font-size="13" fill="#7A7A7A">Friday is a line, not a pile.</text>

    <rect x="712" y="432" width="312" height="72" rx="4" fill="#F8F8F8"/>
    <text x="732" y="462" font-size="15" font-weight="600" fill="#2D2D2D">Ledger is append-only</text>
    <text x="732" y="484" font-size="13" fill="#7A7A7A">Balances are a view, not edits.</text>
  </g>

  <text x="56" y="560" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="13" fill="#7A7A7A">test@alpha.school · test1@alpha.school · guide passcode 2468</text>
  <text x="56" y="588" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="13" fill="#7A7A7A">Editable board: draw.insforge.site · colors never use page blue for the first slice</text>
</svg>
